[package]
name = "partylink-scanner"
version = "0.1.0"
description = "Finds and fingerprints game files in a folder for PartyLink"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "9", default-features = false }

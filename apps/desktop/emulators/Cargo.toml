[package]
name = "partylink-emulators"
version = "0.1.0"
description = "Installs and launches the emulators PartyLink uses for netplay"
edition = "2021"
publish = false

[dependencies]
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "9", default-features = false }

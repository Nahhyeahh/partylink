[package]
name = "partylink"
version = "0.3.1"
description = "PartyLink desktop app"
edition = "2021"
publish = false

[lib]
name = "partylink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
partylink-scanner = { path = "../scanner" }
partylink-emulators = { path = "../emulators" }
tauri-plugin-clipboard-manager = "2"
# Native TLS uses Windows' own certificate store and needs no C compiler.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

name: Desktop app

# Builds the Windows installer.
# - On pull requests that touch the desktop app: builds it and attaches the
#   installer to the workflow run, so a change can be tried before merging.
# - From the Actions tab ("Run workflow") or on a version tag such as v0.1.0:
#   builds it and publishes a GitHub Release with the installer, which is where
#   friends download it. The release is named after the version in
#   apps/desktop/src-tauri/tauri.conf.json.
on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile

      - name: Build installer
        if: ${{ github.event_name == 'pull_request' }}
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri

      - name: Build installer and publish the release
        if: ${{ github.event_name != 'pull_request' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          # tauri-action fills in __VERSION__ and creates the tag if it doesn't exist yet.
          tagName: v__VERSION__
          releaseName: PartyLink v__VERSION__
          releaseBody: |
            Download **PartyLink_..._x64-setup.exe** below and run it.

            Windows may show "Windows protected your PC" because the installer isn't signed yet. Click **More info**, then **Run anyway**.
          releaseDraft: false

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'pull_request' }}
        with:
          name: PartyLink-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
